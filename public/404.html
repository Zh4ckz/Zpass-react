<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#010101">
  <title>404 — Page Not Found · Z Pass</title>
  <link rel="icon" href="images/zpass.png">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;--bg:#010101;--panel:#292F33;--line:#292F33;--text:#FEFEFE;--muted:#A6B3C4;--purple:#8F9EB4}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,#3C589833,transparent 34%),var(--bg);color:var(--text);display:flex;flex-direction:column}
    .top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,calc((100vw - 1120px)/2))}
    .brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font-size:19px;font-weight:850}
    .brand img{width:36px;height:36px;border-radius:11px}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:56px 44px;text-align:center;max-width:460px;width:100%}
    .code{font-size:5rem;font-weight:850;color:var(--purple);line-height:1;margin-bottom:8px}
    h1{font-size:1.5rem;margin:0 0 14px}
    p{color:var(--muted);margin:0 0 28px;line-height:1.6}
    a.home{display:inline-flex;align-items:center;gap:8px;background:var(--purple);color:#fff;border-radius:12px;padding:13px 26px;font-weight:750;text-decoration:none}
    a.home:hover{background:#55667F}
    footer{text-align:center;color:#66757F;padding:26px;font-size:12.5px}
  </style>
  <link rel="stylesheet" href="css/zpass-glass-theme.css?v=101">
  <link rel="stylesheet" href="/css/site-responsive.css?v=102"><link rel="stylesheet" href="/css/mobile-nav.css?v=102">
<script src="/js/zpass-theme.js?v=3"></script><link rel="stylesheet" href="/css/zpass-app-theme.css?v=109"><link rel="stylesheet" href="/css/performance.css">
<link rel="stylesheet" href="/css/zpass-design-system.css">
<link rel="stylesheet" href="/css/unified-2026.css?v=414"></head>
<body>
  <header class="top"><a class="brand" href="/"><img src="images/zpass.png" alt="">Z Pass</a></header>
  <main>
    <div class="card">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a class="home" href="/">← Back to Z Pass</a>
    </div>
  </main>
  <footer>© 2026 Z Pass · Secure digital vault</footer>
<script type="module" src="/js/mobile-nav.mjs?v=4"></script><script type="module" src="/js/wallpapers.mjs?v=414"></script></body>
</html>
