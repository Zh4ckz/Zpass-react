<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZPass Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Top Header Bar -->
    <div class="top-nav">
      <div class="brand">
        <div class="brand-shield">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <span class="brand-name">zpass</span>
      </div>
      <div class="top-actions">
        <button id="btnPause" title="Geçici Duraklat" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="4" width="4" height="16" rx="1"/>
            <rect x="14" y="4" width="4" height="16" rx="1"/>
          </svg>
        </button>
        <button id="btnSettings" title="Ayarlar" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Center Protection Status -->
    <div class="status-center">
      <div id="targetDomain" class="target-domain">youtube.com</div>
      <div id="protectionTitle" class="protection-title">Protection is enabled</div>
      <div id="totalBlocked" class="total-blocked">Total blocked: 1,248</div>

      <!-- Main Toggle Switch -->
      <div class="toggle-wrapper">
        <label class="big-switch">
          <input type="checkbox" id="mainShieldToggle" checked>
          <span class="big-slider">
            <span class="slider-thumb"></span>
          </span>
        </label>
      </div>
    </div>

    <!-- Tab Header (Actions vs Statistics) -->
    <div class="tab-header">
      <button id="tabActions" class="tab-btn active">Actions</button>
      <button id="tabStats" class="tab-btn">Statistics</button>
    </div>

    <!-- Tab Content 1: Actions -->
    <div id="viewActions" class="tab-view active">
      <div class="action-list">
        <button id="actionBlockElement" class="action-item">
          <span class="action-icon red">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
            </svg>
          </span>
          <span class="action-text">Block ads manually</span>
        </button>

        <button id="actionFilteringLog" class="action-item">
          <span class="action-icon green">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="4" y1="6" x2="20" y2="6"/>
              <line x1="4" y1="12" x2="14" y2="12"/>
              <line x1="4" y1="18" x2="18" y2="18"/>
            </svg>
          </span>
          <span class="action-text">Open filtering log</span>
        </button>

        <button id="actionReportIssue" class="action-item">
          <span class="action-icon orange">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 2h4"/>
              <path d="M12 2v8"/>
              <path d="M4 10h16"/>
              <path d="M6 10v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10"/>
              <circle cx="12" cy="16" r="1"/>
            </svg>
          </span>
          <span class="action-text">Report an issue</span>
        </button>

        <button id="actionCheckSecurity" class="action-item">
          <span class="action-icon blue">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="16" x2="12" y2="12"/>
              <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
          </span>
          <div class="action-col">
            <span class="action-text">Check website security</span>
            <span id="securityBadge" class="security-badge">HTTPS & Güvenli</span>
          </div>
        </button>
      </div>
    </div>

    <!-- Tab Content 2: Statistics -->
    <div id="viewStats" class="tab-view">
      <div class="stats-filter-row">
        <span class="stats-pill">All</span>
        <span class="stats-pill active">7 days</span>
      </div>

      <!-- Weekly Trend Canvas -->
      <div class="chart-container">
        <canvas id="statsChart" width="280" height="110"></canvas>
        <div class="chart-days">
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
          <span>Sun</span>
          <span>Mon</span>
          <span>Tue</span>
        </div>
      </div>

      <!-- Breakdown Counts -->
      <div class="breakdown-list">
        <div class="breakdown-row">
          <span class="breakdown-label">Ads</span>
          <span id="statAds" class="breakdown-val">1,104</span>
        </div>
        <div class="breakdown-row">
          <span class="breakdown-label">Trackers</span>
          <span id="statTrackers" class="breakdown-val">9</span>
        </div>
        <div class="breakdown-row">
          <span class="breakdown-label">Social media</span>
          <span id="statSocial" class="breakdown-val">2</span>
        </div>
        <div class="breakdown-row">
          <span class="breakdown-label">Other</span>
          <span id="statOther" class="breakdown-val">75</span>
        </div>
      </div>
    </div>

    <!-- Bottom Footer (Mobile App Promo) -->
    <div class="footer-promo">
      <span>Protect your mobile device</span>
      <div class="os-icons">
        <!-- Apple -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 0.6-2.65 1.36-.58.67-1.09 1.74-.95 2.77.99.08 2.04-.52 2.68-1.28z"/>
        </svg>
        <!-- Android -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.551 0 .9993.4482.9993.9993.0001.5511-.4483.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.414 13.8533 8.077 12 8.077c-1.8533 0-3.5902.337-5.1367.8727L4.841 5.4467a.4161.4161 0 00-.5677-.1521.4157.4157 0 00-.152.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3432-4.1021-2.6889-7.5743-6.1185-9.4396"/>
        </svg>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
