<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Z Pass Bot API & Payments Platform</title>
  <link rel="icon" type="image/png" href="/resources/assets/app-logo/zpass.png">
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --text-main: #1c2733;
      --text-muted: #707579;
      --accent: #3390ec;
      --border: #e6ebf2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.6;
      padding: 32px 20px;
    }
    .wrap {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 24px;
    }
    h1 { margin: 0 0 12px; font-size: 26px; font-weight: 800; }
    p { margin: 0 0 16px; color: var(--text-muted); font-size: 15px; }
    code { background: #eef4fc; color: var(--accent); padding: 3px 8px; border-radius: 6px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Z Pass Bot API & Webhooks</h1>
      <p>Build automated bots, payment integrations, and AI agents for Z Pass using our REST and Webhook Bot API.</p>
      <p>Webhook Endpoint: <code>https://bots.zpas.org/api/bot-webhook</code></p>
    </div>
  </div>
</body>
</html>
