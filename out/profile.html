<!doctype html>
<html lang="en">
<head>
  <script src="/resources/js/profile-routing.js?v=2"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>Open in Z Pass</title>
  <style>
    :root{font-family:Inter,"Segoe UI",sans-serif;color:#111;background:#f5f8fc;font-synthesis:none}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,440px);padding:36px;border:1px solid #e6ebf2;border-radius:24px;background:#fff;box-shadow:0 20px 60px #10233d12}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;font-weight:800}
    .mark{display:grid;width:40px;height:40px;place-items:center;border-radius:13px;background:#2675f4;color:#fff;font-size:21px}
    main[hidden]{display:none}
    main{text-align:center}
    .brand{justify-content:center}
    .avatar{width:132px;height:132px;margin:0 auto 18px;border-radius:50%;background:#e8f0fe center/cover no-repeat;display:grid;place-items:center;color:#2675f4;font-size:48px;font-weight:800}
    .handle{margin-bottom:0;font-size:18px}
    h1{margin:0 0 10px;font-size:30px;letter-spacing:-.7px}
    p{margin:0;color:#586579;line-height:1.6}
    .actions{display:grid;gap:12px;margin-top:26px}
    a{display:flex;min-height:48px;align-items:center;justify-content:center;border:1px solid #2675f4;border-radius:12px;padding:12px 16px;color:#2675f4;font-weight:700;text-decoration:none}
    a.primary{background:#2675f4;color:#fff}
    a:hover{filter:brightness(.96)}
    .note{margin-top:20px;font-size:13px}
    .bot-tag{display:inline-block;margin:6px 0 14px;padding:3px 10px;border-radius:99px;background:#eef4ff;color:#2675f4;font-size:12px;font-weight:700;letter-spacing:.4px}
    .desc{margin:0 auto;max-width:340px}
    .check{display:inline-block;width:24px;height:24px;vertical-align:-3px;margin-left:6px}
    .avatar svg{width:100%;height:100%;border-radius:50%}
  </style>
</head>
<body>
  <main hidden>
    <div class="brand"><span class="mark">Z</span><span>Z Pass</span></div>
    <div id="avatar" class="avatar" hidden></div>
    <h1 id="title">Open in Z Pass</h1>
    <p id="handle" class="handle"></p>
    <div class="actions">
      <a class="primary" id="open-app" href="#">Open in Z Pass</a>
      <a id="download-app" href="https://zpas.org/apps/windows">Download Z Pass</a>
      <a id="web-link" href="#">Continue on the web</a>
    </div>
    <p class="note" id="platform-note">Your browser may ask you to confirm before opening the app.</p>
  </main>
  <script>
    (() => {
      const route = window.__profileRoute;
      if (!route || route.redirect || !route.handle) return;
      const handle = route.handle;
      document.querySelector('main').hidden = false;

      // Official PassGram bots: a full page with picture, name, check and what the bot does.
      const CHECK = '<svg class="check" viewBox="0 0 24 24" aria-label="Verified"><path fill="#2675f4" d="M12 1.6l2.5 1.9 3.1-.2 1 3 2.6 1.7-.9 3 .9 3-2.6 1.7-1 3-3.1-.2L12 22.4l-2.5-1.9-3.1.2-1-3-2.6-1.7.9-3-.9-3 2.6-1.7 1-3 3.1.2z"/><path d="M7.6 12.2l3 3 5.8-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const OFFICIAL = {
        zbot: { name: 'Zbot', about: 'PassGram’s official bot for creating and managing bots. Send /newbot to make your own bot, get its token and set its name, description and commands.',
          avatar: '<svg viewBox="0 0 100 100"><defs><linearGradient id="zg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="100" height="100" fill="url(#zg)"/><rect x="24" y="34" width="52" height="38" rx="12" fill="#fff"/><circle cx="40" cy="52" r="5" fill="#3b5bf6"/><circle cx="60" cy="52" r="5" fill="#3b5bf6"/><rect x="47" y="20" width="6" height="14" rx="3" fill="#fff"/><circle cx="50" cy="19" r="5" fill="#fff"/></svg>' },
        verifybot: { name: 'Verify Bot', about: 'PassGram’s official verification bot. Apply for a blue check for your account or your bot, follow your request, or remove a check.',
          avatar: '<svg viewBox="0 0 100 100"><defs><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f9bff"/><stop offset="1" stop-color="#1565d8"/></linearGradient></defs><rect width="100" height="100" fill="url(#vg)"/><path fill="#fff" d="' + (() => { let d = ''; for (let i = 0; i <= 240; i++) { const a = i / 240 * Math.PI * 2, r = 30.5 + 2.2 * Math.cos(12 * a); d += (i ? 'L' : 'M') + (50 + r * Math.cos(a)).toFixed(2) + ' ' + (50 + r * Math.sin(a)).toFixed(2); } return d + 'Z'; })() + '"/><path d="M38.5 50.5l8 8 16-17" fill="none" stroke="#1e7bea" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
      };
      const official = route.official && OFFICIAL[handle];
      if (official) {
        document.title = official.name + ' — PassGram';
        const av = document.getElementById('avatar');
        av.hidden = false; av.innerHTML = official.avatar; av.style.background = 'none';
        document.getElementById('title').innerHTML = official.name + CHECK;
        const h = document.getElementById('handle');
        h.innerHTML = '@' + handle + '<br><span class="bot-tag">BOT</span><br><span class="desc">' + official.about + '</span>';
        document.getElementById('open-app').textContent = 'Open ' + official.name + ' in PassGram';
      }

      const appLink = 'zpass://profile/' + encodeURIComponent(handle);
      if (!official) {
        document.title = '@' + handle + ' on Z Pass';
        document.getElementById('title').textContent = '@' + handle;
      }
      document.getElementById('open-app').href = appLink;
      document.getElementById('web-link').href = 'https://web.zpas.org/web?profile=' + encodeURIComponent(handle);

      // Static profile links work on Firebase's free Hosting plan.
      const avatar = document.getElementById('avatar');
      if (!official) {
        avatar.hidden = false;
        avatar.textContent = handle.charAt(0).toUpperCase();
      }

      const ua = navigator.userAgent;
      if (/android/i.test(ua)) {
        // Installed Android app opens through the verified App Link before this page loads.
        location.replace('/apps/android');
      } else {
        document.getElementById('download-app').href = /windows/i.test(ua) ? '/apps/windows' : '/apps';
        location.href = appLink;
      }
    })();
  </script>
</body>
</html>
