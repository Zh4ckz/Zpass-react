<!doctype html>
<html lang="en">
<head>
  <script src="/resources/js/profile-routing.js?v=2"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f1724">
  <title>PassGram</title>
  <link rel="icon" type="image/png" href="/resources/assets/app-logo/zpass.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#eef3f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--accent:#2675f4;--ring:#ffffff;--pattern:#c9d6e8;
      font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
    @media (prefers-color-scheme:dark){:root{--bg:#0b111b;--card:#151d2b;--text:#f1f5f9;--muted:#8b98ab;--ring:#151d2b;--pattern:#1c2738}}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:flex;flex-direction:column;background:var(--bg)}
    /* soft dotted pattern like a chat wallpaper */
    body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:radial-gradient(var(--pattern) 1.2px,transparent 1.2px);background-size:22px 22px;opacity:.7}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px}
    .brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:800;font-size:20px;text-decoration:none;letter-spacing:-.3px}
    .brand img{width:34px;height:34px;border-radius:10px}
    .get{padding:10px 18px;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;text-decoration:none}
    .wrap{flex:1;display:grid;place-items:center;padding:12px 18px 40px}
    main{width:min(100%,440px);padding:38px 30px 30px;border-radius:30px;background:var(--card);text-align:center;box-shadow:0 30px 80px #0f172a1f}
    main[hidden]{display:none}
    .avatar{width:136px;height:136px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
      background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;font-size:54px;font-weight:800;box-shadow:0 0 0 5px var(--ring),0 12px 30px #2563eb33}
    .avatar.ghost{background:linear-gradient(135deg,#94a3b8,#64748b)}
    .avatar img,.avatar svg{width:100%;height:100%;object-fit:cover;display:block}
    h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
    .check{width:25px;height:25px;flex:none}
    .user{margin:6px 0 0;color:var(--muted);font-size:17px}
    .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
    .chips:empty{display:none}
    .chip{padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;background:#2675f41a;color:var(--accent)}
    .chip.company{background:#64748b1f;color:var(--muted)}
    .about{margin:16px auto 0;max-width:340px;color:var(--muted);line-height:1.6;white-space:pre-line}
    .about:empty{display:none}
    .send{display:inline-flex;align-items:center;justify-content:center;gap:9px;margin-top:26px;min-width:230px;padding:16px 30px;border-radius:99px;
      background:var(--accent);color:#fff;font-weight:800;font-size:16px;letter-spacing:.3px;text-decoration:none;box-shadow:0 12px 28px #2675f455;transition:transform .12s,filter .12s}
    .send:hover{filter:brightness(1.07)}.send:active{transform:scale(.97)}
    .send svg{width:20px;height:20px}
    .hint{margin:20px 0 0;color:var(--muted);font-size:14.5px;line-height:1.6}
    .hint b{color:var(--text)}
    .skeleton{display:inline-block;min-width:150px;height:30px;border-radius:9px;background:linear-gradient(90deg,#94a3b822,#94a3b844,#94a3b822);background-size:200% 100%;animation:sk 1.1s infinite}
    @keyframes sk{to{background-position:-200% 0}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="https://zpas.org/"><img src="/resources/assets/app-logo/zpass.png" alt="">PassGram</a>
    <a class="get" id="get-app" href="/apps">Get the app</a>
  </header>
  <div class="wrap">
    <main hidden>
      <div id="avatar" class="avatar"></div>
      <h1 id="title"><span class="skeleton"></span></h1>
      <p id="user" class="user"></p>
      <div id="chips" class="chips"></div>
      <p id="about" class="about"></p>
      <a class="send" id="send" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg><span id="send-label">Send Message</span></a>
      <p class="hint" id="hint"></p>
    </main>
  </div>
  <script>
    (() => {
      const route = window.__profileRoute;
      if (!route || route.redirect || !route.handle) return;
      const handle = route.handle;
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      document.querySelector('main').hidden = false;

      // Where "Send Message" goes: the PassGram app on Android, the web chat on computers (the Windows app has no chats yet).
      const ua = navigator.userAgent;
      const android = /android/i.test(ua);
      const appUrl = 'zpass://resolve?domain=' + encodeURIComponent(handle);
      const target = android
        ? 'intent://resolve?domain=' + encodeURIComponent(handle) + '#Intent;scheme=zpass;package=com.zpass;S.browser_fallback_url=' + encodeURIComponent('https://zpas.org/apps/android') + ';end'
        : 'https://web.zpas.org/web?profile=' + encodeURIComponent(handle);
      $('send').href = target;
      $('get-app').href = android ? '/apps/android' : /windows/i.test(ua) ? '/apps/windows' : '/apps';

      // The same blue check as in the app (Material "Verified", #38BDF8).
      const CHECK = '<svg class="check" viewBox="0 0 24 24" role="img" aria-label="Verified"><path fill="#38BDF8" d="M23 11.99l-2.44-2.79.34-3.69-3.61-.82-1.89-3.2L12 2.96 8.6 1.5 6.71 4.69 3.1 5.5l.34 3.7L1 11.99l2.44 2.79-.34 3.7 3.61.82L8.6 22.5l3.4-1.47 3.4 1.46 1.89-3.19 3.61-.82-.34-3.69L23 11.99zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z"/></svg>';
      const PERSON = '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="9" r="4.2"/><path d="M4 20.5c.9-4.2 4.2-6.3 8-6.3s7.1 2.1 8 6.3"/></svg>';
      const rosette = (() => { let d = ''; for (let i = 0; i <= 240; i++) { const a = i / 240 * Math.PI * 2, r = 30.5 + 2.2 * Math.cos(12 * a); d += (i ? 'L' : 'M') + (50 + r * Math.cos(a)).toFixed(2) + ' ' + (50 + r * Math.sin(a)).toFixed(2); } return d + 'Z'; })();
      const OFFICIAL = {
        zbot: { name: 'Zbot', username: 'zbot', avatarHtml: '<img src="/resources/assets/bots/zbot.jpg" alt="Zbot">',
          about: 'PassGram’s official bot for making and managing bots.' },
        verifybot: { name: 'Verify Bot', username: 'verifybot',
          avatarHtml: '<svg viewBox="0 0 100 100" aria-label="Verify Bot"><defs><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f9bff"/><stop offset="1" stop-color="#1565d8"/></linearGradient></defs><rect width="100" height="100" fill="url(#vg)"/><path fill="#fff" d="' + rosette + '"/><path d="M38.5 50.5l8 8 16-17" fill="none" stroke="#1e7bea" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
          about: 'PassGram’s official verification bot.' },
      };

      function show(p) {
        document.title = p.name + ' — PassGram';
        $('title').innerHTML = esc(p.name) + (p.verified ? CHECK : '');
        $('user').textContent = '@' + p.username;
        $('chips').innerHTML = (p.bot ? '<span class="chip">BOT</span>' : '') + (p.company ? '<span class="chip company">' + esc(p.company) + '</span>' : '');
        $('about').textContent = p.about || '';
        $('send-label').textContent = p.bot ? 'Start Bot' : 'Send Message';
        $('hint').innerHTML = 'If you have <b>PassGram</b>, you can contact <b>' + esc(p.name) + '</b> right away.';
        const av = $('avatar');
        av.classList.remove('ghost');
        if (p.avatarHtml) { av.innerHTML = p.avatarHtml; av.style.background = 'none'; }
        else if (p.photo) { const img = new Image(); img.alt = ''; img.onload = () => { av.innerHTML = ''; av.appendChild(img); }; img.src = p.photo; av.textContent = p.name.charAt(0).toUpperCase(); }
        else av.textContent = p.name.charAt(0).toUpperCase();
      }

      // Unknown usernames look like Telegram: no 404, just "contact @name"; the app then says if it exists.
      function showUnknown() {
        document.title = 'Contact @' + handle + ' — PassGram';
        const av = $('avatar'); av.classList.add('ghost'); av.innerHTML = PERSON;
        $('title').textContent = '@' + handle;
        $('user').textContent = '';
        $('hint').innerHTML = 'If you have <b>PassGram</b>, you can contact <b>@' + esc(handle) + '</b> right away.';
      }

      const official = route.official && OFFICIAL[handle];
      if (official) show({ ...official, verified: true, bot: true });
      else {
        const API = 'https://botapi.zpas.org';
        fetch(API + '/public/profile/' + encodeURIComponent(handle), { signal: AbortSignal.timeout(8000) })
          .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
          .then(({ result }) => show({ ...result, photo: result.photo ? API + result.photo : null }))
          .catch(showUnknown);
      }

      // Like t.me: try to open the app right away on phones. On computers the button opens the web chat.
      if (android) setTimeout(() => { location.href = target; }, 120);
      void appUrl;
    })();
  </script>
</body>
</html>
